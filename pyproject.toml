[project]
name = "tp2"
version = "0.1.0"
description = "Preprocesamiento auditable de un corpus de legislación electoral"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.32.0",
    "langchain-chroma>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "pypdf>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
